# Build do deepseek-harness-mobile no SEU fork — zero secrets, zero configuração.
#
# O que este workflow faz:
#   1. Baixa o rootfs (o "motor" dsh, Debian+Node) de dsh-io/dsh-arm64
#      — por padrão PINADO na v0.1.0-rc.6 com verificação de SHA-256.
#   2. GERA UMA CHAVE DE ASSINATURA EFÊMERA (keytool) a cada execução —
#      é a versão "fds a assinatura" que realmente instala: sem keystore,
#      o assembleRelease produz um APK unsigned que o Android recusa.
#   3. Roda os testes unitários (JVM/Robolectric) e locais JS/C.
#   4. Empacota o proot dos repositórios oficiais do Termux — SOMENTE
#      DEPOIS dos testes: EngineManagerTest/ProotRuntimeTest cobrem os
#      caminhos de FALHA da extração e assumem que os assets proot/arm64-v8a
#      NÃO existem no ambiente JVM (Robolectric serve src/main/assets).
#   5. Monta o APK release assinado e publica como prerelease no SEU fork
#      — dá pra baixar direto do celular pela aba Releases.
#   6. SMOKE TEST: abre o APK em emuladores x86_64/KVM (API 34 e 35 —
#      35 = Android 15, o nível do aparelho que está crashando) e
#      despeja o logcat (crash + boot log do app). O job falha se o
#      app morrer na abertura — é ele que diagnostica "crasha ao abrir".
#
# ⚠️ Consequência da chave efêmera: cada build tem uma assinatura diferente.
#    Pra instalar um build novo sobre um antigo, DESINSTALE o anterior
#    antes (senão o Android bloqueia por "signature mismatch").
#    Se um dia quiser assinatura estável sem secrets: gere um
#    release.keystore com keytool e comite no repo — o build.gradle.kts
#    do projeto já o detecta automaticamente na raiz.

name: Build DSH APK (fork)

on:
  workflow_dispatch:
    inputs:
      rootfs_tag:
        description: 'Tag do rootfs em dsh-io/dsh-arm64 (vazio = latest)'
        required: false
        default: 'v0.1.0-rc.6'
      rootfs_sha256:
        description: 'SHA-256 esperado do rootfs (vazio = não verificar)'
        required: false
        default: '53ecb5be190a8cc4c2e594de202e13355b4c2e2673c34c7f65a6337dba752f20'
  push:
    branches: [main]

permissions:
  contents: write # necessário apenas para criar a prerelease com o APK

jobs:
  build:
    name: Build signed APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-36 platform-tools build-tools;36.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Resolve version
        id: ver
        run: |
          echo "version_name=0.2.0-fork" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # ── 1. Rootfs (motor dsh: Debian bookworm + Node + dsh) ──────────────
      - name: Download rootfs from dsh-io/dsh-arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          TAG="${{ inputs.rootfs_tag || 'v0.1.0-rc.6' }}"
          if [ -n "$TAG" ]; then EP="releases/tags/$TAG"; else EP="releases/latest"; fi
          asset_url=$(gh api "repos/dsh-io/dsh-arm64/$EP" \
            --jq '.assets[] | select(.name | startswith("dsh-arm64-rootfs-")) | .url' | head -1)
          [ -n "$asset_url" ] || { echo "rootfs asset not found in dsh-io/dsh-arm64 ($EP)"; exit 1; }
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o app/src/main/assets/rootfs.tar.xz
          ls -lh app/src/main/assets/rootfs.tar.xz

      - name: Verify rootfs SHA-256
        # Push runs têm inputs vazios: manter o pin rc.6 verificado também
        # no trigger por push (não afrouxar a verificação só porque veio de
        # um push em vez de dispatch manual).
        if: ${{ inputs.rootfs_sha256 != '' || github.event_name == 'push' }}
        run: |
          echo "${{ inputs.rootfs_sha256 || '53ecb5be190a8cc4c2e594de202e13355b4c2e2673c34c7f65a6337dba752f20' }}  app/src/main/assets/rootfs.tar.xz" | sha256sum -c -

      # ── 2. Chave de assinatura efêmera (alias/senhas = defaults que o
      #        build.gradle.kts do projeto já espera: release/android) ─────
      - name: Generate ephemeral signing key
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore -alias release \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=dsh-fork-build"

      # ── 3. Testes — com assets/proot AUSENTE (o passo 4 depende disso) ──
      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Run local JS/C tests
        run: ./tests/run-local.sh

      # ── 4. Proot + libs dos repositórios oficiais do Termux ─────────────
      # DEPOIS dos testes, de propósito (mesma ordem do release.yml
      # upstream): os testes de extração cobrem caminhos de FALHA e
      # assumem que proot/arm64-v8a NÃO existe em src/main/assets — o
      # Robolectric serve esse diretório nos testes JVM. Se este passo
      # rodar antes, ensureProot() extrai os assets reais e os testes
      # "startEngine fails without proot assets" e "ensureProot requires
      # the shared libs too" quebram. O rootfs.tar.xz não interfere
      # (nenhum teste o lê — comprovado pelo CI verde no mesmo commit).
      - name: Package proot runtime (arm64)
        run: |
          # Resolve os caminhos dos .deb pelo índice APT em vez de pinar
          # versões: o pool do Termux só mantém o release corrente, então
          # URL pinada dá 404 (curl exit 22) no primeiro bump upstream
          # (proot 5.1.107.91 -> .92).
          ABI=aarch64
          IDX="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-${ABI}/Packages"
          mkdir -p /tmp/proot && cd /tmp/proot
          curl -sfL "$IDX" -o Packages
          deb_path() {
            awk -v pkg="$1" '
              { sub(/\r$/, "") }
              $0 == "Package: " pkg { inpkg = 1; next }
              /^$/                  { inpkg = 0 }
              inpkg && /^Filename:/  { print $2; exit }
            ' Packages
          }
          BASE="https://packages.termux.dev/apt/termux-main"
          for pkg in proot libtalloc libandroid-shmem; do
            path=$(deb_path "$pkg")
            [ -n "$path" ] || { echo "package $pkg not found in Termux index"; exit 1; }
            echo "resolved $pkg -> $path"
            curl -sfL -o "$pkg.deb" "$BASE/$path"
          done
          mkdir -p x && for d in proot libtalloc libandroid-shmem; do
            ar x "$d.deb" && tar -xf data.tar.xz -C x && rm -f data.tar.xz
          done
          P=x/data/data/com.termux/files
          cp "$P/usr/bin/proot" . && cp "$P/usr/lib/libtalloc.so.2" "$P/usr/lib/libandroid-shmem.so" .
          # Loaders: Termux proot is built with PROOT_UNBUNDLE_LOADER pointing
          # at /data/data/com.termux/files/usr/libexec/proot/loader — a path
          # no other app can traverse (EACCES). Without bundling our own copy
          # plus the PROOT_LOADER/PROOT_LOADER_32 env overrides, EVERY jailed
          # exec dies with "execve(...): Permission denied" (device-reproduced
          # on SM-A075M/Android 15, proot 5.1.107.92).
          cp "$P/usr/libexec/proot/loader" "$P/usr/libexec/proot/loader32" .
          file proot | grep -q ELF || { echo "proot not ELF"; exit 1; }
          file loader | grep -q ELF || { echo "proot loader not ELF"; exit 1; }
          readelf --dyn-syms proot | grep -q talloc || { echo "proot missing talloc ref"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/proot/arm64-v8a"
          cp proot libtalloc.so.2 libandroid-shmem.so loader loader32 "$GITHUB_WORKSPACE/app/src/main/assets/proot/arm64-v8a/"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.ver.outputs.version_name }}" \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            -PabiFilter=arm64-v8a

      # ── 5. Artifact + prerelease ─────────────────────────────────────────
      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release*.apk dist/
          mv dist/app-release*.apk "dist/dsh-apk-fork-b${{ github.run_number }}.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-apk
          path: dist/*.apk

      - name: Publish as prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Fork build #${{ github.run_number }}
          prerelease: true
          files: dist/*.apk

  # ── 6. Smoke test v3: o caminho REAL do primeiro boot do motor ─────────────────────
  # Não basta "a Activity abriu": o motor precisa extrair 43k entries do
  # rootfs (1-3 min no emulador) e o smoke antigo (30s) nunca viu isso
  # completar — os bugs de extração só apareciam no aparelho real.
  #   FASE 1 — lança o app e MATA o processo no MEIO da extração (deixa
  #            o rootfs parcial no disco, com symlinks absolutos criados).
  #   FASE 2 — relança e exige que a RE-EXTRAÇÃO sobre a árvore parcial
  #            complete com engineReady=true. Reproduz exatamente o bug do
  #            aparelho: ./etc/alternatives/pager -> /bin/more (alvo absoluto
  #            que EXISTE no Android) fazia a canonicalização do resolveTarget
  #            escapar do root — toda re-extração morria com "tar entry
  #            escapes extraction root", sem recuperação.
  #   FASE 3 — zero FATAL EXCEPTION, processo vivo, Activity em foco.
  # Container init NÃO é gate: emulador x86_64 vs proot/rootfs arm64 (a
  # validação de exec fica para o aparelho real, targetSdk 28).
  # (arm64 no macOS runner não funciona: HVF aninhado indisponível —
  # "HVF error: HV_UNSUPPORTED", run 35037994609 morreu no boot.)
  # Matrix de API: 34 (baseline) e 35 — Android 15, o nível do aparelho
  # do usuário (OneUI 7).
  smoke:
    name: Smoke test (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dsh-apk
          path: dist
          # Sem isto o v8 extrai em dist/<artifact-name>/... e o glob
          # dist/*.apk abaixo não acha nada (falso 'crash' no run 35040638141).
          merge-multiple: true

      # KVM no ubuntu runner: boot do emulador x86_64 em ~3 min.
      - name: Enable KVM device access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ⚠️ O android-emulator-runner divide o input `script:` em LINHAS e
      # executa cada uma num `sh -c` separado (fonte: script-parser.ts da
      # action). if/fi, for e variáveis entre linhas são impossíveis lá
      # (run 35041272494: "Syntax error: end of file unexpected (expecting
      # fi)"). Solução: gravar o script num arquivo e invocá-lo em UMA linha.
      - name: Write smoke test script
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          #!/bin/sh
          set -x
          cd "$GITHUB_WORKSPACE" || exit 1
          # adb no PATH (ubuntu runner) mesmo que a action não exporte.
          export PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools:$PATH"
          PKG=com.dshmobile.shell
          fail() {
            echo "===== SMOKE FAIL: $1 ====="
            echo "----- dsh-applog (tail) -----"
            adb logcat -d -s dsh-applog:I | tail -120 || true
            echo "----- AndroidRuntime / libc / DEBUG -----"
            adb logcat -d -s AndroidRuntime:E libc:F DEBUG:F || true
            exit 1
          }
          # Busca recursiva: à prova de subdiretório criado pelo download.
          APK=$(find dist -type f -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "===== NO APK UNDER dist — conteúdo atual: ====="
            ls -laR dist || true
            exit 1
          fi
          ls -lh "$APK"
          adb install -r "$APK" || fail "install failed"

          echo "===== PHASE 1 (API ${{ matrix.api }}): launch, interrupt mid-extraction ====="
          adb logcat -c
          # am start pode retornar erro se o app crashar durante o launch;
          # || true garante que o logcat do crash ainda é despejado no fail().
          adb shell am start -W -n "$PKG/.MainActivity" || true
          STARTED=""
          I=0
          while [ "$I" -lt 45 ]; do
            if adb logcat -d -s dsh-applog:I | grep -q "write bit stripped"; then
              STARTED=1
              break
            fi
            PID=$(adb shell pidof "$PKG" | tr -d '\r')
            [ -z "$PID" ] && fail "process died before extraction started (t=$((I*2))s)"
            sleep 2
            I=$((I+1))
          done
          [ -n "$STARTED" ] || fail "extraction never started within 90s of launch"
          # ./etc/alternatives/pager (entry #49 do tar) é criado ~1s após o início;
          # o dsh bin.js (entry #12540 de 42993) só aparece no fim. Matar aqui deixa
          # a árvore PARCIAL com symlinks absolutos no disco — exatamente o estado
          # de execução interrompida que fazia toda re-extração morrer com
          # 'tar entry escapes extraction root'.
          sleep 2
          adb shell am force-stop "$PKG"
          sleep 3
          PID=$(adb shell pidof "$PKG" | tr -d '\r')
          [ -z "$PID" ] || fail "force-stop did not kill the process"

          echo "===== PHASE 2: relaunch over the interrupted tree ====="
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" || true
          STARTED2=""
          I=0
          while [ "$I" -lt 30 ]; do
            if adb logcat -d -s dsh-applog:I | grep -q "boot: extracting rootfs to"; then
              STARTED2=1
              break
            fi
            PID=$(adb shell pidof "$PKG" | tr -d '\r')
            [ -z "$PID" ] && fail "process died before re-extraction started (t=$((I*2))s)"
            sleep 2
            I=$((I+1))
          done
          [ -n "$STARTED2" ] || fail "relaunch did not re-extract (phase-1 kill came after extraction finished — vacuous run, tighten phase-1 timing)"
          DONE=""
          I=0
          while [ "$I" -lt 240 ]; do
            LOG=$(adb logcat -d -s dsh-applog:I)
            if echo "$LOG" | grep -q "escapes extraction root"; then
              fail "re-extraction died on a symlink (resolveTarget regression)"
            fi
            if echo "$LOG" | grep -q "boot: extract FAILED"; then
              fail "re-extraction failed (boot: extract FAILED)"
            fi
            if echo "$LOG" | grep -q "engineReady=true"; then
              DONE=1
              break
            fi
            PID=$(adb shell pidof "$PKG" | tr -d '\r')
            [ -z "$PID" ] && fail "process died during re-extraction (t=$((I*2))s)"
            sleep 2
            I=$((I+1))
          done
          [ -n "$DONE" ] || fail "re-extraction did not reach engineReady=true within 8 min"
          echo "===== PHASE 2 OK: interrupted-tree re-extraction recovered (engineReady=true) ====="

          echo "===== PHASE 3: app health ====="
          sleep 10
          # pidof sozinho dá falso positivo (watchdog STICKY reinicia); exigir
          # também ZERO FATAL EXCEPTION na janela pós-relançamento.
          FATALS=$(adb logcat -d -s AndroidRuntime:E | grep -c "FATAL EXCEPTION" || true)
          if [ "$FATALS" != "0" ]; then
            fail "fatal exceptions in phase-2 window: $FATALS"
          fi
          PID=$(adb shell pidof "$PKG" | tr -d '\r')
          [ -n "$PID" ] || fail "process dead at end"
          echo "===== ResumedActivity ====="
          adb shell dumpsys activity activities 2>/dev/null | grep -iE "ResumedActivity" || true
          echo "===== boot markers (informational; container init pode falhar no x86_64 — proot arm64) ====="
          adb logcat -d -s dsh-applog:I | grep -E "boot:|extract: done|container" || true
          echo "SMOKE PASS: re-extraction over an interrupted tree completed, engineReady=true, app alive"
          EOF
          chmod +x "$RUNNER_TEMP/smoke.sh"
          echo "===== smoke.sh gravado: ====="
          cat "$RUNNER_TEMP/smoke.sh"

      - name: Boot emulator and start the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Uma ÚNICA linha — o script real mora no arquivo gravado acima.
          script: sh "$RUNNER_TEMP/smoke.sh"